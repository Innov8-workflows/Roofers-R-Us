<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif;background:#101318}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;filter:grayscale(.2)}
  .wash{position:absolute;inset:0;background:#101318;opacity:.64}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 46%,rgba(0,0,0,.12) 0%,rgba(0,0,0,.6) 100%)}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 70px 70px}
  .logo{height:130px;width:auto;display:block;margin-bottom:24px;filter:drop-shadow(0 6px 22px rgba(0,0,0,.5))}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;color:#fff;font-size:60px;line-height:1.05;letter-spacing:-.015em;text-shadow:0 3px 18px rgba(0,0,0,.55)}
  .stars{margin-top:14px;font-size:42px;letter-spacing:.16em;color:#F5B417;text-shadow:0 3px 14px rgba(0,0,0,.5)}
  .sub{margin-top:14px;font-size:25px;font-weight:600;color:#E9A48F;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.55)}
  .foot{margin-top:18px;font-size:22px;font-weight:600;color:#E8EDF7;text-shadow:0 2px 10px rgba(0,0,0,.55)}
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="roof.jpg" alt="">
    <div class="wash"></div>
    <div class="vig"></div>
    <div class="inner">
      <img class="logo" src="logo.webp" alt="">
      <h1>How did we do?</h1>
      <div class="stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>
      <p class="sub">A few words on Google takes about thirty seconds</p>
      <div class="foot">roofersrus.co.uk</div>
    </div>
  </div>
</body>
</html>
